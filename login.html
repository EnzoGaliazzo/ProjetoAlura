<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Netflix - Login</title>
</head>
<body>
    <div class="login-container">
        <h1>Quem está assistindo?</h1>
        <div class="profiles">
            <a href="index.html" class="profile">
                <img src="https://www.svgrepo.com/show/452030/avatar-default.svg" alt="Perfil 1">

            </a>
            <a href="index.html" class="profile">
                <img src="https://www.svgrepo.com/show/452030/avatar-default.svg" alt="Perfil 2">

            </a>
            <a href="index.html" class="profile">
                <img src="https://www.svgrepo.com/show/452030/avatar-default.svg" alt="Perfil 3">
                <span>Convidado</span>
            </a>
            <a href="index.html" class="profile">
                <img src="https://www.svgrepo.com/show/452030/avatar-default.svg" alt="Perfil Infantil">
                <span>Kids</span>
            </a>
        </div>
        <button class="manage-profiles-btn">Gerenciar Perfis</button>
    </div>

</html>
